name: Lint and Tests

on:
  workflow_dispatch:

  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install the tools of mise.toml
        uses: jdx/mise-action@v5

      - name: Run make lint
        run: make lint

  kind-test:
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install the tools of mise.toml
        uses: jdx/mise-action@v5

      - name: Build the image
        run: make build

      - name: Run the end-to-end test in kind
        run: make kind-test
